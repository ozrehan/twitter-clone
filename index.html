<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home / X</title>
<style>
  /* ============ X dark theme tokens ============ */
  :root {
    --bg: #000;
    --text: #e7e9ea;
    --text-dim: #71767b;
    --border: #2f3336;
    --accent: #1d9bf0;
    --accent-hover: #1a8cd8;
    --pink: #f91880;
    --green: #00ba7c;
    --card: #16181c;
    --search-bg: #202327;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; }
  a { color: inherit; text-decoration: none; }
  button { font-family: var(--font); }

  /* ============ 3-column layout ============ */
  .layout { display: flex; max-width: 1265px; margin: 0 auto; min-height: 100vh; }

  /* ============ Left nav ============ */
  .nav { width: 275px; flex-shrink: 0; padding: 4px 12px; position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; }
  .nav .logo { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; margin-bottom: 2px; }
  .nav .logo:hover { background: rgba(231,233,234,.1); }
  .nav .logo svg { width: 30px; height: 30px; fill: var(--text); }
  .nav-item { display: flex; align-items: center; gap: 20px; padding: 12px;
    border-radius: 9999px; font-size: 20px; color: var(--text); cursor: pointer; width: fit-content; }
  .nav-item:hover { background: rgba(231,233,234,.1); }
  .nav-item.active { font-weight: 700; }
  .nav-item svg { width: 26px; height: 26px; }
  .nav-post { margin-top: 16px; width: 90%; background: #fff; color: #000; border: none;
    border-radius: 9999px; padding: 16px; font-size: 17px; font-weight: 700; cursor: pointer; }
  .nav-post:hover { background: #d7dbdc; }
  .nav-user { margin-top: auto; margin-bottom: 12px; display: flex; align-items: center; gap: 12px;
    padding: 10px; border-radius: 9999px; cursor: pointer; }
  .nav-user:hover { background: rgba(231,233,234,.1); }
  .nav-user img { width: 40px; height: 40px; border-radius: 50%; }
  .nav-user .who { flex: 1; line-height: 1.3; }
  .nav-user .who b { display: block; font-size: 15px; }
  .nav-user .who span { color: var(--text-dim); font-size: 14px; }

  /* ============ Center column ============ */
  .center { width: 600px; flex-shrink: 0; border-left: 1px solid var(--border);
    border-right: 1px solid var(--border); min-height: 100vh; }
  .tabs { position: sticky; top: 0; z-index: 10; background: rgba(0,0,0,.65);
    backdrop-filter: blur(12px); display: flex; border-bottom: 1px solid var(--border); }
  .tab { flex: 1; text-align: center; padding: 16px 0 0; cursor: pointer; color: var(--text-dim);
    font-size: 15px; }
  .tab span { display: inline-block; padding-bottom: 14px; position: relative; }
  .tab.active { color: var(--text); font-weight: 700; }
  .tab.active span::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 0; width: 56px; height: 4px; border-radius: 9999px; background: var(--accent); }
  .tab:hover { background: rgba(231,233,234,.08); }

  /* ============ Compose box ============ */
  .compose { display: flex; gap: 12px; padding: 16px; border-bottom: 1px solid var(--border); }
  .compose img.avatar, .tweet img.avatar, .reply-row img.avatar { width: 40px; height: 40px;
    border-radius: 50%; flex-shrink: 0; }
  .compose-body { flex: 1; }
  .compose-input { font-size: 20px; color: var(--text); padding: 8px 0; min-height: 40px;
    outline: none; word-break: break-word; }
  .compose-input:empty::before { content: "What is happening?!"; color: var(--text-dim); }
  .compose-tools { display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; }
  .compose-icons { display: flex; gap: 2px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: none;
    color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: rgba(29,155,240,.1); }
  .icon-btn svg { width: 18px; height: 18px; }
  .post-btn { background: var(--accent); color: #fff; border: none; border-radius: 9999px;
    padding: 8px 20px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .post-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .post-btn:disabled { opacity: .5; cursor: default; }

  /* ============ Tweet cards ============ */
  .tweet { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background .15s; }
  .tweet:hover { background: rgba(255,255,255,.03); }
  .tweet-body { flex: 1; min-width: 0; }
  .tweet-head { display: flex; align-items: center; gap: 4px; color: var(--text-dim);
    font-size: 15px; white-space: nowrap; overflow: hidden; }
  .tweet-head b { color: var(--text); }
  .tweet-head .vbadge { width: 18px; height: 18px; flex-shrink: 0; }
  .tweet-head .handle, .tweet-head .time { overflow: hidden; text-overflow: ellipsis; }
  .tweet-text { margin: 2px 0 10px; line-height: 1.4; word-wrap: break-word; }
  .tweet-text .tag { color: var(--accent); }
  .tweet-img { width: 100%; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 4px; }

  /* action row */
  .actions { display: flex; justify-content: space-between; max-width: 425px; margin: 4px -8px 0; }
  .act { display: flex; align-items: center; gap: 2px; color: var(--text-dim); font-size: 13px;
    background: none; border: none; cursor: pointer; padding: 0; }
  .act .circ { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; transition: background .15s; }
  .act svg { width: 18px; height: 18px; fill: currentColor; }
  .act.reply:hover { color: var(--accent); } .act.reply:hover .circ { background: rgba(29,155,240,.1); }
  .act.repost:hover { color: var(--green); } .act.repost:hover .circ { background: rgba(0,186,124,.1); }
  .act.like:hover { color: var(--pink); } .act.like:hover .circ { background: rgba(249,24,128,.1); }
  .act.views:hover { color: var(--accent); } .act.views:hover .circ { background: rgba(29,155,240,.1); }
  .act.like.liked { color: var(--pink); }
  .act.like.liked svg { fill: var(--pink); }
  .act.repost.reposted { color: var(--green); }
  .act .end-icons { display: flex; }

  /* inline reply box + nested replies */
  .reply-box { display: flex; gap: 10px; padding: 10px 0 4px; }
  .reply-box .r-input { flex: 1; background: var(--search-bg); border: 1px solid var(--border);
    border-radius: 9999px; padding: 10px 16px; color: var(--text); font-size: 14px; outline: none; }
  .reply-box .r-input:focus { border-color: var(--accent); }
  .reply-box button { background: var(--accent); color: #fff; border: none; border-radius: 9999px;
    padding: 6px 16px; font-weight: 700; cursor: pointer; font-size: 14px; }
  .nested { margin-top: 8px; border-left: 2px solid var(--border); padding-left: 12px;
    display: flex; flex-direction: column; gap: 8px; }
  .nested .n { font-size: 14px; line-height: 1.4; }
  .nested .n b { margin-right: 4px; }
  .nested .n span.h { color: var(--text-dim); }

  /* ============ Right sidebar ============ */
  .right { width: 350px; flex-shrink: 0; padding: 4px 0 0 30px; }
  .search { position: sticky; top: 4px; z-index: 5; background: var(--bg); padding-bottom: 12px; }
  .search-box { display: flex; align-items: center; gap: 12px; background: var(--search-bg);
    border-radius: 9999px; padding: 12px 16px; border: 1px solid transparent; }
  .search-box:focus-within { border-color: var(--accent); background: var(--bg); }
  .search-box svg { width: 18px; height: 18px; fill: var(--text-dim); flex-shrink: 0; }
  .search-box input { background: none; border: none; outline: none; color: var(--text);
    font-size: 15px; width: 100%; }
  .card { background: var(--card); border-radius: 16px; margin-bottom: 16px; overflow: hidden; }
  .card h2 { font-size: 20px; font-weight: 800; padding: 12px 16px; }
  .card .row { padding: 12px 16px; cursor: pointer; }
  .card .row:hover { background: rgba(255,255,255,.03); }
  .trend .cat, .trend .posts { color: var(--text-dim); font-size: 13px; }
  .trend .topic { font-weight: 700; font-size: 15px; margin: 2px 0; }
  .premium p { color: var(--text); font-size: 15px; line-height: 1.4; padding: 0 16px 12px; }
  .premium button, .who .follow-btn { background: var(--accent); color: #fff; border: none;
    border-radius: 9999px; padding: 8px 18px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .premium button { margin: 0 16px 16px; }
  .premium button:hover { background: var(--accent-hover); }
  .who .row { display: flex; align-items: center; gap: 12px; }
  .who img { width: 40px; height: 40px; border-radius: 50%; }
  .who .nm { flex: 1; line-height: 1.3; min-width: 0; }
  .who .nm b { display: flex; align-items: center; gap: 4px; font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .nm b svg { width: 16px; height: 16px; flex-shrink: 0; }
  .who .nm span { color: var(--text-dim); font-size: 14px; }
  .who .follow-btn { background: var(--text); color: #000; padding: 7px 18px; font-size: 14px; }
  .who .follow-btn.following { background: transparent; color: var(--text);
    border: 1px solid #536471; }
  .who .more { color: var(--accent); padding: 12px 16px; display: block; font-size: 15px; }

  /* ============ Responsive ============ */
  @media (max-width: 1100px) { .right { display: none; } .layout { max-width: 915px; } }
  @media (max-width: 700px) {
    .nav { width: 68px; padding: 4px; align-items: center; }
    .nav-item span.lbl, .nav-post, .nav-user .who, .nav-user .dots { display: none; }
    .nav-item { gap: 0; }
    .center { width: calc(100vw - 68px); }
  }
</style>
</head>

/* =====================================================================

/* ---------- SVG snippets ---------- */
const VBADGE = '<svg class="vbadge" viewBox="0 0 24 24"><path fill="#1d9bf0" d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/></svg>';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
/* format counts like X: 1.2K, 45K, 1.1M */
function fmt(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}
const avatar = seed => `https://picsum.photos/seed/${seed}/80/80`;
/* turn #hashtags blue */
function linkify(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/(#[\w]+)/g, '<span class="tag">$1</span>');
}

/* ---------- trends + who-to-follow data ---------- */
const TRENDS = [

  { cat: "Sports · Trending", topic: "Kohli", posts: "89.4K posts" },

  { cat: "Trending in India", topic: "#BuildInPublic", posts: "12.1K posts" },
  { cat: "Sports · Trending", topic: "El Clásico", posts: "210K posts" },
];
const FOLLOWS = [
  { name: "Andrej Karpathy", handle: "karpathy", seed: "karpathy", verified: true },
  { name: "GitHub", handle: "github", seed: "githuborg", verified: true },
  { name: "NASA", handle: "NASA", seed: "nasaorg", verified: true },
];

/* ---------- render: trends + follow list ---------- */
function renderTrends() {
  $("#trends").innerHTML = TRENDS.map(t => `
    <div class="row trend">
      <div class="cat">${t.cat}</div>
      <div class="topic">${t.topic}</div>
      <div class="posts">${t.posts}</div>
    </div>`).join("");
}
function renderFollows() {
  $("#followList").innerHTML = FOLLOWS.map((f, i) => `
    <div class="row">
      <img src="${avatar(f.seed)}" alt="${f.name}">
      <div class="nm"><b>${f.name} ${f.verified ? VBADGE : ""}</b><span>@${f.handle}</span></div>
      <button class="follow-btn" data-i="${i}">Follow</button>
    </div>`).join("");
}

/* ---------- render: one tweet card ---------- */
function tweetHTML(t) {
  return `
  <article class="tweet" data-id="${t.id}">
    <img class="avatar" src="${avatar(t.handle)}" alt="${t.name}">
    <div class="tweet-body">
      <div class="tweet-head">
        <b>${t.name}</b>${t.verified ? VBADGE : ""}
        <span class="handle">@${t.handle} ·</span><span class="time">${t.time}</span>
      </div>
      <div class="tweet-text">${linkify(t.text).replace(/\n/g, "<br>")}</div>
      ${t.img ? `<img class="tweet-img" src="${t.img}" alt="tweet image" loading="lazy">` : ""}
      <div class="actions">
        <button class="act reply" data-act="reply" title="Reply"><span class="circ">${ICONS.reply}</span><span class="cnt">${fmt(t.replies)}</span></button>
        <button class="act repost ${t.reposted ? "reposted" : ""}" data-act="repost" title="Repost"><span class="circ">${ICONS.repost}</span><span class="cnt">${fmt(t.reposts)}</span></button>
        <button class="act like ${t.liked ? "liked" : ""}" data-act="like" title="Like"><span class="circ">${ICONS.like}</span><span class="cnt">${fmt(t.likes)}</span></button>
        <button class="act views" data-act="views" title="Views"><span class="circ">${ICONS.views}</span><span class="cnt">${fmt(t.views)}</span></button>
        <span class="end-icons">
          <button class="act reply" data-act="bookmark" title="Bookmark"><span class="circ">${ICONS.bookmark}</span></button>
          <button class="act reply" data-act="share" title="Share"><span class="circ">${ICONS.share}</span></button>
        </span>
      </div>
      <div class="reply-slot"></div>
      <div class="nested">${t.nested.map(n => `<div class="n"><b>${n.name}</b><span class="h">@${n.handle} · ${n.time}</span><br>${linkify(n.text)}</div>`).join("")}</div>
    </div>
  </article>`;
}

/* ---------- render: timeline (tab filter) ---------- */
let activeTab = "foryou";
function renderTimeline() {
  const list = activeTab === "following" ? TWEETS.filter(t => t.following) : TWEETS;
  $("#timeline").innerHTML = list.length
    ? list.map(tweetHTML).join("")
    : `<div style="padding:40px;text-align:center;color:var(--text-dim)">No posts yet — follow more accounts.</div>`;
}

/* ---------- interactions (event delegation) ---------- */
$("#timeline").addEventListener("click", e => {
  const btn = e.target.closest(".act");
  if (!btn) return;
  const card = e.target.closest(".tweet");
  const t = TWEETS.find(x => x.id == card.dataset.id);
  const act = btn.dataset.act;

  if (act === "like") {                       // pink heart toggle
    t.liked = !t.liked;
    t.likes += t.liked ? 1 : -1;
    btn.classList.toggle("liked", t.liked);
    btn.querySelector(".cnt").textContent = fmt(t.likes);
  } else if (act === "repost") {              // green repost toggle
    t.reposted = !t.reposted;
    t.reposts += t.reposted ? 1 : -1;
    btn.classList.toggle("reposted", t.reposted);
    btn.querySelector(".cnt").textContent = fmt(t.reposts);
  } else if (act === "reply") {               // inline reply box
    const slot = card.querySelector(".reply-slot");
    if (slot.innerHTML) { slot.innerHTML = ""; return; }  // toggle closed
    slot.innerHTML = `
      <div class="reply-box">
        <img class="avatar" src="${avatar("youavatar")}" alt="you">
        <input class="r-input" placeholder="Post your reply">
        <button class="r-send">Reply</button>
      </div>`;
    const input = slot.querySelector(".r-input");
    input.focus();
    const send = () => {
      const text = input.value.trim();
      if (!text) return;
      t.nested.push({ name: "Builder Dev", handle: "builder_dev", time: "now", text });
      t.replies++;
      renderTimeline();                       // re-render to show nested reply
    };
    slot.querySelector(".r-send").onclick = send;
    input.onkeydown = ev => { if (ev.key === "Enter") send(); };
  }
});

/* Follow buttons toggle Follow <-> Following */
$("#followList").addEventListener("click", e => {
  const btn = e.target.closest(".follow-btn");
  if (!btn) return;
  const on = btn.classList.toggle("following");
  btn.textContent = on ? "Following" : "Follow";
});

/* tabs: For you / Following filter */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    tab.classList.add("active");
    activeTab = tab.dataset.tab;
    renderTimeline();
  });
});

/* ---------- composer: enable Post when typing, prepend on post ---------- */
const composeInput = $("#composeInput"), postBtn = $("#postBtn");
composeInput.addEventListener("input", () => {
  postBtn.disabled = !composeInput.textContent.trim();
});
postBtn.addEventListener("click", () => {
  const text = composeInput.textContent.trim();
  if (!text) return;
  TWEETS.unshift({
    id: Date.now(), name: "Builder Dev", handle: "builder_dev", verified: false,
    time: "now", text, img: null,
    replies: 0, reposts: 0, likes: 0, views: 12,
    following: true, liked: false, reposted: false, nested: []
  });
  composeInput.textContent = "";
  postBtn.disabled = true;
  if (activeTab !== "foryou") {               // new post belongs to you -> show it
    document.querySelector('[data-tab="foryou"]').click();
  } else renderTimeline();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
/* Enter (without shift) posts, like X */
composeInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); postBtn.click(); }
});

/* ---------- init ---------- */
renderTrends();
renderFollows();
renderTimeline();
</script>
